  nextjs:
    container_name: WebApp
    build:
      args:
        - MONGODB_URL=$MONGODB_URL
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - AUTH_SECRET=$AUTH_SECRET
      - AUTH_TRUST_HOST=$AUTH_TRUST_HOST
      - MONGODB_URL=$MONGODB_URL
      - NEXTAUTH_URL=$NEXTAUTH_URL
    restart: unless-stopped
