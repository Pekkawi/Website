image: docker
services:
  - docker:dind
stages:
  - deploy
deploy-prod:
  stage: deploy
  script:
    # build the Docker image from the Dockerfile in the current folder and
    # give the resulting image a tag/name
    - docker build . -t thecore-docker
    # run the Docker container in detached mode and allow it
    # to be removed automatically when it exits or when the Docker daemon exits
    - docker run -d -p 3000:3000 --rm --name thecore-docker nextjs-application
  only:
    - main # This job runs only on the main branch
  tags:
    - deploy
